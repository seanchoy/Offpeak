name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Lint first: fastest feedback, and catches undefined names that compileall misses.
      - run: ruff check app tests

      - run: python -m compileall app

        # Smoke test: the app must import with only the required env vars set.
        # Catches startup crashes (bad Settings defaults, broken engine args) that
        # the pure-logic tests never touch.
      - name: Smoke test (import app.main)
        run: python -c "import app.main"
        env:
          DATABASE_URL: postgresql://
          JWT_SECRET_KEY: ci-not-secret
          GEMINI_API_KEY: ci-not-secret

      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
